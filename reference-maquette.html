<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="DO HAB - maatwerk in hout: kasten, dressings, keukens en interieur.">
<title>DO HAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600&display=swap">

<style>
/* ==================================================================
   DO HAB — maquette
   COULEURS       : bloc :root ci-dessous
   TEXTES         : script, objet T (nl / fr / en)
   PHOTOS         : script, tableau JOBS
   CATEGORIES     : script, tableau CATS
   TEINTES        : script, tableau FINITIONS
   ------------------------------------------------------------------
   Parti pris : la photo parle, la typo se tait.
   Une seule police, en graisses légères. Pas de gros titres gras.
   Fonds clairs uniquement — jamais de version sombre.
   ================================================================== */
:root{
  color-scheme:light;
  --paper:#FFFFFF;        /* fond principal : les photos dominent */
  --ground:#FAF8F5;       /* bandes alternées, très légèrement chaudes */
  --surface:#FFFFFF;
  --surface-2:#F1ECE4;
  --ink:#33302B;          /* brun-gris sombre, jamais du noir pur */
  --soft:#5C574F;
  --muted:#8C847A;
  --line:#EAE4DB;
  --accent:#5D6E51;       /* vert sauge — repris de la bibliothèque verte */
  --accent-ink:#FFFFFF;
  --accent-soft:#EEF1E9;

  --f:"Figtree","Helvetica Neue",Arial,sans-serif;

  --t-xs:.76rem;
  --t-sm:.9rem;
  --t-md:1.02rem;
  --t-lg:clamp(1.1rem,1.02rem + .35vw,1.28rem);
  --t-h3:clamp(1.15rem,1.05rem + .4vw,1.4rem);
  --t-h2:clamp(1.55rem,1.3rem + 1.1vw,2.25rem);
  --t-h1:clamp(1.9rem,1.5rem + 1.7vw,3rem);

  --gut:clamp(1.15rem,4.5vw,4rem);
  --maxw:1400px;
  --split:minmax(0,1fr) minmax(0,1fr);
  --gap:clamp(1.6rem,4vw,4rem);
  --r:3px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f);
  font-size:var(--t-md);font-weight:400;line-height:1.7;letter-spacing:.005em;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{margin:0;font-weight:500;letter-spacing:-.012em;line-height:1.18;text-wrap:balance}
h1{font-size:var(--t-h1);font-weight:400;line-height:1.12}
h2{font-size:var(--t-h2)}
h3{font-size:var(--t-h3)}
p{margin:0}
a{color:inherit}
img{display:block;max-width:100%}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:var(--r)}
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:var(--gut)}
/* la barre de navigation est collante : on décale les ancres */
section[id]{scroll-margin-top:90px}
@media (max-width:960px){section[id]{scroll-margin-top:132px}}
.narrow{max-width:62ch}
.eyebrow{font-size:var(--t-xs);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.lead{font-size:var(--t-lg);color:var(--soft);line-height:1.6}
.dim{color:var(--muted)}

/* ---- bandes ---- */
.band{padding-block:clamp(3.5rem,8vw,7rem)}
.band.tint{background:var(--ground)}
.band.tight{padding-block:clamp(2.5rem,5vw,4rem)}

/* ---- apparitions, plus douces qu'avant ---- */
.rv{opacity:0;transform:translateY(14px);transition:opacity .8s cubic-bezier(.22,.7,.25,1),transform .8s cubic-bezier(.22,.7,.25,1);transition-delay:var(--d,0ms)}
.rv.in{opacity:1;transform:none}
/* le voile est sur l'image, pas sur le conteneur : sinon le conteneur
   a une surface nulle et l'IntersectionObserver ne le voit jamais */
.rv-img img{clip-path:inset(0 0 100% 0);transition:clip-path 1.1s cubic-bezier(.18,.8,.26,1);transition-delay:var(--d,0ms)}
.rv-img.in img{clip-path:inset(0 0 0 0)}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .rv{opacity:1;transform:none;transition:none}
  .rv-img img{clip-path:none;transition:none}
}

/* ---- barre de démo ---- */
.mockbar{background:var(--accent-soft);color:var(--accent);font-size:var(--t-xs);font-weight:600;
  letter-spacing:.06em;padding:.5rem var(--gut);display:flex;align-items:center;
  justify-content:center;gap:1rem;flex-wrap:wrap}

/* ---- navigation ---- */
.nav{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:1.6rem;height:76px}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;margin-right:auto}
.brand b{font-weight:600;letter-spacing:.16em;font-size:1.02rem}
.brand .tagsm{font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--line);padding:.16rem .4rem;border-radius:var(--r)}
.nav-links{display:flex;gap:1.9rem}
.nav-links a{font-size:var(--t-sm);font-weight:400;text-decoration:none;color:var(--soft);
  padding-block:.2rem;border-bottom:1px solid transparent;transition:.25s}
.nav-links a:hover{color:var(--ink);border-bottom-color:var(--accent)}
/* sur mobile les liens passent sur une deuxième ligne qui défile,
   plutôt que de disparaître derrière un menu burger */
@media (max-width:960px){
  .nav-in{flex-wrap:wrap;height:auto;padding-block:.9rem;gap:.9rem}
  .nav-links{order:3;flex:1 0 100%;gap:1.3rem;overflow-x:auto;padding-bottom:.15rem;
    scrollbar-width:none;-ms-overflow-style:none}
  .nav-links::-webkit-scrollbar{display:none}
  .nav-links a{white-space:nowrap}
}
.lang{display:flex;gap:.15rem}
.lang button{background:none;border:0;cursor:pointer;padding:.3rem .45rem;border-radius:var(--r);
  font-size:var(--t-xs);font-weight:600;letter-spacing:.08em;color:var(--muted);transition:.2s}
.lang button:hover{color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;cursor:pointer;
  text-decoration:none;font-size:var(--t-sm);font-weight:500;letter-spacing:.01em;
  padding:.8rem 1.5rem;border-radius:var(--r);border:1px solid var(--accent);
  background:var(--accent);color:var(--accent-ink);transition:.25s}
.btn:hover{background:#4E5D44;border-color:#4E5D44}
.btn.line{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.line:hover{background:transparent;border-color:var(--ink)}
.btn.pale{background:rgba(255,255,255,.94);color:var(--ink);border-color:transparent}
.btn.pale:hover{background:#fff}
.btn.sm{padding:.55rem 1.05rem;font-size:var(--t-xs);letter-spacing:.04em}
@media (max-width:700px){.nav .btn{display:none}}

/* ---- hero pleine largeur ---- */
.hero{position:relative;min-height:clamp(420px,64vh,640px);display:flex;align-items:flex-end;overflow:hidden}
.hero > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.hero::after{content:"";position:absolute;inset:0;
  background:linear-gradient(103deg,rgba(28,26,23,.72) 0%,rgba(28,26,23,.46) 40%,rgba(28,26,23,.06) 70%)}
.hero-in{position:relative;z-index:2;width:100%;padding-block:clamp(2.2rem,5vw,3.6rem)}
.hero-txt{max-width:44ch;color:#fff}
.hero-txt .eyebrow{color:rgba(255,255,255,.8);letter-spacing:.12em}
.hero-txt h1{margin-top:.7rem;color:#fff}
.hero-txt h1 em{font-style:normal;font-weight:300}
.hero-txt p{margin-top:.9rem;color:rgba(255,255,255,.88);font-size:var(--t-lg);line-height:1.55}
.hero-cta{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.6rem}
/* sur mobile le dégradé doit venir du bas, pas du côté */
@media (max-width:860px){
  .hero{min-height:clamp(460px,72vh,620px)}
  .hero::after{background:linear-gradient(180deg,rgba(28,26,23,.12) 0%,rgba(28,26,23,.52) 46%,rgba(28,26,23,.84) 100%)}
  .hero-txt{max-width:none}
  .hero-cta .btn{flex:1 1 100%}
}

/* ---- trois promesses ---- */
.promises{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)}
@media (max-width:820px){.promises{grid-template-columns:1fr;gap:1.6rem}}
.promise .eyebrow{display:block}
.promise b{display:block;font-weight:500;font-size:var(--t-h3);margin-top:.5rem}
.promise p{color:var(--muted);font-size:var(--t-sm);margin-top:.35rem;max-width:34ch}

/* ---- en-tête de section ---- */
.head{display:grid;grid-template-columns:var(--split);gap:var(--gap);align-items:end;
  margin-bottom:clamp(2rem,4vw,3rem)}
@media (max-width:860px){.head{grid-template-columns:1fr;gap:1rem;align-items:start}}
.head h2{margin-top:.6rem}
.head .lead{max-width:46ch}

/* ---- tuiles de catégorie ---- */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(.6rem,1.2vw,1rem)}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{position:relative;display:block;border:0;padding:0;cursor:pointer;overflow:hidden;
  border-radius:var(--r);aspect-ratio:4/5;background:var(--surface-2)}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.tile::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(30,28,25,0) 42%,rgba(30,28,25,.62) 100%);transition:.35s}
.tile:hover img{transform:scale(1.05)}
.tile:hover::after{background:linear-gradient(180deg,rgba(30,28,25,.06) 30%,rgba(30,28,25,.74) 100%)}
.tile span{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:1rem 1.1rem;
  color:#fff;font-size:var(--t-sm);font-weight:500;text-align:left;letter-spacing:.01em}

/* ---- filtres ---- */
.filters{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-bottom:clamp(1.4rem,3vw,2.2rem)}
.chip{cursor:pointer;background:transparent;border:1px solid var(--line);border-radius:999px;
  padding:.48rem 1.05rem;font-size:var(--t-sm);color:var(--soft);transition:.22s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.active-color{display:none;align-items:center;gap:.55rem;margin-left:auto;
  border:1px solid var(--line);border-radius:999px;padding:.3rem .55rem .3rem .35rem}
.active-color.on{display:inline-flex}
.active-color .dot{width:18px;height:18px;border-radius:50%;border:1px solid var(--line)}
.active-color .x{background:none;border:0;cursor:pointer;color:var(--muted);font-size:1rem;line-height:1;padding:0 .15rem}

/* ---- galerie ---- */
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(1rem,2vw,1.8rem);align-items:start}
@media (max-width:1180px){.gal{grid-template-columns:repeat(3,1fr)}}
@media (max-width:900px){.gal{grid-template-columns:repeat(2,1fr)}}
@media (max-width:379px){.gal{grid-template-columns:1fr}}
.card{display:flex;flex-direction:column;cursor:zoom-in;background:none;border:0;padding:0;text-align:left}
.card.hide{display:none}
.card .thumb{aspect-ratio:1/1;overflow:hidden;border-radius:var(--r);background:var(--surface-2)}
.card .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.card:hover .thumb img{transform:scale(1.045)}
.card h3{font-size:var(--t-md);font-weight:500;margin-top:.85rem}
.card:hover h3{color:var(--accent)}
.card p{font-size:var(--t-sm);color:var(--muted);margin-top:.25rem;line-height:1.55}
.card .meta{display:flex;gap:.45rem;align-items:center;margin-top:.6rem;
  font-size:var(--t-xs);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.card .dot{width:11px;height:11px;border-radius:50%;border:1px solid var(--line);flex:none}
.empty{color:var(--muted);padding:2rem 0}

/* ---- lightbox ---- */
.lb{position:fixed;inset:0;z-index:100;background:rgba(26,24,21,.93);display:none;
  align-items:center;justify-content:center;padding:clamp(1rem,4vw,3rem)}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:80vh;width:auto;border-radius:var(--r)}
.lb .cap{position:absolute;left:0;right:0;bottom:0;padding:1.2rem;color:rgba(255,255,255,.9);
  font-size:var(--t-sm);text-align:center}
.lb .close{position:absolute;top:1rem;right:1.1rem;background:none;border:1px solid rgba(255,255,255,.35);
  border-radius:var(--r);color:#fff;cursor:pointer;font-size:1rem;line-height:1;padding:.4rem .65rem}

/* ---- lignes image + texte ---- */
.feat{display:grid;grid-template-columns:var(--split);gap:var(--gap);align-items:center}
.feat + .feat{margin-top:clamp(3rem,6vw,5.5rem)}
@media (max-width:860px){.feat{grid-template-columns:1fr}}
.feat.flip .feat-art{order:2}
@media (max-width:860px){.feat.flip .feat-art{order:0}}
.feat-art img{width:100%;aspect-ratio:5/4;object-fit:cover;border-radius:var(--r)}
.feat h2{margin-top:.6rem}
.feat .lead{margin-top:1rem}
.feat ul{margin:1.5rem 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.7rem}
.feat li{display:grid;grid-template-columns:auto 1fr;gap:.75rem;align-items:baseline;
  font-size:var(--t-sm);color:var(--soft)}
.feat li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);transform:translateY(-2px)}

/* ---- teintes ---- */
.finis{display:grid;grid-template-columns:repeat(10,1fr);gap:clamp(.6rem,1.6vw,1.4rem)}
@media (max-width:1100px){.finis{grid-template-columns:repeat(5,1fr)}}
@media (max-width:600px){.finis{grid-template-columns:repeat(3,1fr)}}
.fin{background:none;border:0;padding:0;cursor:pointer;text-align:center;transition:.25s}
.fin .swatch{display:block;width:100%;aspect-ratio:1/1;border-radius:50%;border:1px solid var(--line);
  transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.fin:hover .swatch{transform:scale(1.06)}
.fin[aria-pressed="true"] .swatch{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--accent)}
.fin .n{display:block;font-size:var(--t-xs);color:var(--soft);margin-top:.6rem;line-height:1.35}
.note{margin-top:clamp(1.5rem,3vw,2.2rem);color:var(--muted);font-size:var(--t-sm);max-width:60ch}

/* ---- étapes ---- */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--gap)}
@media (max-width:980px){.steps{grid-template-columns:repeat(2,1fr);gap:2rem}}
@media (max-width:520px){.steps{grid-template-columns:1fr;gap:1.6rem}}
.step .num{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;
  border-radius:50%;background:var(--accent-soft);color:var(--accent);
  font-size:var(--t-xs);font-weight:600}
.step h3{font-size:var(--t-md);font-weight:500;margin-top:.8rem}
.step p{color:var(--muted);font-size:var(--t-sm);margin-top:.4rem}

/* ---- à propos ---- */
.about{display:grid;grid-template-columns:var(--split);gap:var(--gap);align-items:center}
@media (max-width:860px){.about{grid-template-columns:1fr}}
.about img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r)}
.about .body p{color:var(--soft);margin-top:1rem;max-width:52ch}

/* ---- contact ---- */
.contact{display:grid;grid-template-columns:var(--split);gap:var(--gap)}
@media (max-width:860px){.contact{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:.35rem;margin-bottom:1rem}
.field label{font-size:var(--t-xs);font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea,.field select{background:var(--paper);border:1px solid var(--line);
  border-radius:var(--r);padding:.78rem .9rem;font-size:var(--t-sm)}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.form-note{color:var(--muted);font-size:var(--t-xs);margin-top:.8rem;line-height:1.6}
.sent{margin-top:1rem;background:var(--accent-soft);color:var(--accent);border-radius:var(--r);
  padding:.7rem .9rem;font-size:var(--t-sm);display:none}
.sent.on{display:block}
.direct{display:flex;flex-direction:column;gap:.7rem;align-self:start}
.direct a{display:flex;align-items:center;justify-content:space-between;gap:1rem;text-decoration:none;
  border:1px solid var(--line);border-radius:var(--r);padding:1.05rem 1.2rem;background:var(--paper);transition:.25s}
.direct a:hover{border-color:var(--accent);background:var(--accent-soft)}
.direct .k{display:block;font-size:var(--t-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.direct .v{font-size:var(--t-md);font-weight:500}
.direct .arw{color:var(--accent)}
.zone{border:1px solid var(--line);border-radius:var(--r);padding:1.05rem 1.2rem;color:var(--muted);font-size:var(--t-sm)}
.zone .k{display:block;font-size:var(--t-xs);letter-spacing:.1em;text-transform:uppercase;margin-bottom:.3rem}

/* ---- pied de page ---- */
.foot{background:var(--ground);border-top:1px solid var(--line);padding-block:clamp(2.6rem,5vw,4rem) 3rem}
.foot-in{display:grid;grid-template-columns:1.4fr 1fr 1.2fr;gap:var(--gap)}
@media (max-width:860px){.foot-in{grid-template-columns:1fr;gap:1.6rem}}
.foot p,.foot li{color:var(--muted);font-size:var(--t-sm)}
.foot b{font-weight:600;letter-spacing:.16em}
.foot ul{list-style:none;padding:0;margin:.6rem 0 0;display:flex;flex-direction:column;gap:.35rem}
.foot a{text-decoration:none}
.foot a:hover{color:var(--accent)}
.foot .k{font-size:var(--t-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.legal{margin-top:2.4rem;padding-top:1.3rem;border-top:1px solid var(--line);font-size:var(--t-xs);color:var(--muted)}
</style>
</head>
<body>


<div class="mockbar"><span data-i18n="mock.bar"></span></div>

<header class="nav">
  <div class="wrap nav-in">
    <a class="brand" href="#top"><b>DO&nbsp;HAB</b><span class="tagsm">demo</span></a>
    <nav class="nav-links">
      <a href="#work" data-i18n="nav.work"></a>
      <a href="#finitions" data-i18n="nav.colors"></a>
      <a href="#process" data-i18n="nav.process"></a>
      <a href="#about" data-i18n="nav.about"></a>
    </nav>
    <div class="lang" role="group" aria-label="Taal / Langue">
      <button type="button" data-lang="nl" aria-pressed="true">NL</button>
      <button type="button" data-lang="fr" aria-pressed="false">FR</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <a class="btn sm" href="#contact" data-i18n="nav.cta"></a>
  </div>
</header>

/* ============================================================
   4. LOGIQUE — normalement rien à changer ici
   ============================================================ */
let lang="nl", cat="all", fin=null;
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const hex=id=>(FINITIONS.find(f=>f.id===id)||{}).hex||"#888";
const fname=id=>(FINITIONS.find(f=>f.id===id)||{}).n||"";

$("#tiles").innerHTML = CATS.map((c,i)=>`
  <button class="tile rv" type="button" data-cat="${c.cat}" style="--d:${i*80}ms">
    <img src="${c.img}" alt="" loading="lazy">
    <span data-i18n="${c.key}"></span>
  </button>`).join("");

$("#finis").innerHTML = FINITIONS.map((f,i)=>`
  <button class="fin rv" type="button" data-fin="${f.id}" aria-pressed="false" style="--d:${i*40}ms">
    <span class="swatch" style="background:${f.hex}"></span>
    <span class="n">${f.n}</span>
  </button>`).join("");

$("#gal").innerHTML = JOBS.map((j,i)=>`
  <article class="card rv" data-cat="${j.cat}" data-fin="${j.fin}" data-k="${j.k}" style="--d:${(i%4)*80}ms">
    <div class="thumb"><img src="${j.img}" alt="" loading="lazy"></div>
    <h3 data-i18n="${j.k}.t"></h3>
    <p data-i18n="${j.k}.c"></p>
    <div class="meta"><span class="dot" style="background:${hex(j.fin)}"></span><span>${fname(j.fin)}</span></div>
  </article>`).join("");

$("#steps").innerHTML = [1,2,3,4,5].map((n,i)=>`
  <div class="step rv" style="--d:${i*80}ms"><span class="num">0${n}</span>
  <h3 data-i18n="p${n}.t"></h3><p data-i18n="p${n}.d"></p></div>`).join("");

function applyLang(){
  const d=T[lang];
  $$("[data-i18n]").forEach(el=>{const v=d[el.dataset.i18n]; if(v!==undefined) el.textContent=v;});
  $$("[data-i18n-html]").forEach(el=>{const v=d[el.dataset.i18nHtml]; if(v!==undefined) el.innerHTML=v;});
  $$(".lang button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.lang===lang)));
  document.documentElement.lang=lang;
  $$("#gal .card").forEach(c=>{
    const t=d[c.dataset.k+".t"]||"";
    c.querySelector("img").alt=t;
  });
}
function applyFilter(){
  let n=0;
  $$("#gal .card").forEach(c=>{
    const ok=(cat==="all"||c.dataset.cat===cat)&&(!fin||c.dataset.fin===fin);
    c.classList.toggle("hide",!ok); if(ok) n++;
  });
  $("#empty").style.display=n?"none":"block";
  $("#activeColor").classList.toggle("on",!!fin);
}
$$(".chip").forEach(b=>b.addEventListener("click",()=>{
  cat=b.dataset.cat;
  $$(".chip").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  applyFilter();
}));
$$(".fin").forEach(b=>b.addEventListener("click",()=>{
  const id=b.dataset.fin;
  fin=(fin===id)?null:id;
  $$(".fin").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.fin===fin)));
  if(fin){ $("#acSw").style.background=hex(fin); $("#acName").textContent=fname(fin); }
  applyFilter();
  if(fin) document.getElementById("work").scrollIntoView({behavior:"smooth",block:"start"});
}));
$("#acClear").addEventListener("click",()=>{
  fin=null; $$(".fin").forEach(x=>x.setAttribute("aria-pressed","false")); applyFilter();
});
/* les tuiles de pièce pilotent le même filtre que les chips */
$$(".tile").forEach(t=>t.addEventListener("click",()=>{
  cat=t.dataset.cat;
  $$(".chip").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.cat===cat)));
  applyFilter();
  document.getElementById("work").scrollIntoView({behavior:"smooth",block:"start"});
}));
$$(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang; applyLang();}));
$("#form").addEventListener("submit",e=>{e.preventDefault(); $("#sent").classList.add("on");});

/* lightbox */
const lb=$("#lb");
function openLb(card){
  $("#lbImg").src=card.querySelector("img").src;
  $("#lbCap").textContent=T[lang][card.dataset.k+".t"]||"";
  lb.classList.add("on");
}
$("#gal").addEventListener("click",e=>{const c=e.target.closest(".card"); if(c) openLb(c);});
lb.addEventListener("click",e=>{if(e.target===lb||e.target.id==="lbClose") lb.classList.remove("on");});
addEventListener("keydown",e=>{if(e.key==="Escape") lb.classList.remove("on");});

/* reveal */
if(matchMedia("(prefers-reduced-motion: reduce)").matches){
  $$(".rv,.rv-img").forEach(el=>el.classList.add("in"));
}else{
  const io=new IntersectionObserver(en=>{
    en.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in"); io.unobserve(x.target);}});
  },{rootMargin:"0px 0px -6% 0px",threshold:.1});
  $$(".rv,.rv-img").forEach(el=>io.observe(el));
}

applyLang();
applyFilter();
</script>

</body>
</html>
